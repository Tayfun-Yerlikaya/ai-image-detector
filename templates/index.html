<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detective | Image Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .file-drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            position: relative;
        }

        .file-drop-zone:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .drop-title {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .drop-subtitle {
            font-size: 0.85rem;
            color: #64748b;
        }

        input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .btn-submit {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .result-container {
            margin-top: 32px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.4s ease-out;
        }

        .preview-box {
            width: 100%;
            max-height: 380px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 380px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .result-card {
            border-left: 4px solid;
            padding-left: 16px;
        }

        .result-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .confidence-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .confidence-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease-out;
        }

        .confidence-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .error-box {
            margin-top: 20px;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-size: 0.9rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🔍 AI Detective</h1>
            <p>Analyze whether an image is AI Generated or Real</p>
        </div>

        <form class="upload-form" action="/" method="post" enctype="multipart/form-data">
            <div class="file-drop-zone">
                <div class="icon">📸</div>
                <div class="drop-title" id="file-label">Upload or Drag an Image</div>
                <div class="drop-subtitle">PNG, JPG, JPEG or WEBP (Max. 10MB)</div>
                <input type="file" name="file" accept="image/*" required onchange="updateLabel(this)">
            </div>
            <button type="submit" class="btn-submit">Analyze Image</button>
        </form>

        {% if result %}
        <div class="result-container">
            <div class="preview-box">
                <img src="{{ result.image_data }}" alt="Analyzed Image">
            </div>

            <div class="result-card" style="border-left-color: {{ result.color }};">
                <div class="result-title" style="color: {{ result.color }};">
                    {{ result.prediction }}
                </div>
                
                <div class="confidence-bar-bg">
                    <div class="confidence-bar-fill" style="width: {{ result.confidence }}%; background-color: {{ result.color }};"></div>
                </div>

                <div class="confidence-text">
                    <span>Confidence Score</span>
                    <strong>%{{ result.confidence }}</strong>
                </div>
            </div>
        </div>
        {% endif %}

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}
    </div>

    <script>
        function updateLabel(input) {
            const label = document.getElementById('file-label');
            if (input.files && input.files[0]) {
                label.innerText = "📁 " + input.files[0].name;
            }
        }
    </script>
</body>
</html>
